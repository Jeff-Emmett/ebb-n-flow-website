services:
  ebbflow-prod:
    container_name: ebbflow-prod
    restart: unless-stopped
    labels:
    - traefik.enable=true
    - traefik.http.routers.ebbflow.rule=Host(`ebb-staging.jeffemmett.com`)
    - traefik.http.services.ebbflow.loadbalancer.server.port=80
    networks:
    - traefik-public
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:80/
      interval: 30s
      timeout: 10s
      retries: 3
    image: localhost:3000/jeffemmett/ebb-n-flow-website:${IMAGE_TAG:-latest}
networks:
  traefik-public:
    external: true
